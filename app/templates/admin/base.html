{% extends 'base.html' %}

{% block content %}
<div class="d-flex" style="min-height: calc(100vh - 60px);">
    <!-- Sidebar -->
    <nav class="d-flex flex-column p-3 text-white" style="width:240px; min-width:240px; background: linear-gradient(180deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);">
        <div class="mb-4 mt-2">
            <span class="d-flex align-items-center gap-2 fw-bold fs-6">
                <i class="fas fa-shield-alt text-warning"></i>
                Admin Panel
            </span>
            <small class="text-white-50">{{ current_user.username }}</small>
        </div>

        <ul class="nav nav-pills flex-column gap-1 mb-auto">
            <li class="nav-item">
                <a href="{{ url_for('admin.dashboard') }}"
                   class="nav-link text-white {% if request.endpoint == 'admin.dashboard' %}active bg-primary{% else %}text-white-50{% endif %}">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('admin.users_list') }}"
                   class="nav-link {% if 'admin.users' in request.endpoint or 'admin.user' in request.endpoint %}active bg-primary{% else %}text-white-50{% endif %}">
                    <i class="fas fa-users me-2"></i>Users
                </a>
            </li>
        </ul>

        <hr class="text-white-50">
        <a href="{{ url_for('cv.dashboard') }}" class="nav-link text-white-50 small">
            <i class="fas fa-arrow-left me-2"></i>Back to App
        </a>
    </nav>

    <!-- Main content -->
    <div class="flex-grow-1 p-4" style="background:#f0f2f5;">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
