{% extends 'admin/base.html' %}
{% block title %}Edit Profile — {{ user.username }}{% endblock %}

{% block admin_content %}
<div class="mb-4">
    <a href="{{ url_for('admin.user_detail', user_id=user.id) }}" class="text-muted text-decoration-none small">
        <i class="fas fa-arrow-left me-1"></i>{{ user.username }}
    </a>
    <h2 class="fw-bold mt-1">Edit Profile — {{ user.username }}</h2>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ profile.name or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Professional Title</label>
                    <input type="text" name="title" class="form-control" value="{{ profile.title or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ profile.email or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ profile.phone or '' }}">
                </div>
                <div class="col-md-12">
                    <label class="form-label fw-semibold">Location</label>
                    <input type="text" name="location" class="form-control" value="{{ profile.location or '' }}">
                </div>
                <div class="col-md-12">
                    <label class="form-label fw-semibold">Professional Summary</label>
                    <textarea name="summary" class="form-control" rows="5">{{ profile.summary or '' }}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">LinkedIn URL</label>
                    <input type="url" name="linkedin_url" class="form-control" value="{{ profile.linkedin_url or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">GitHub URL</label>
                    <input type="url" name="github_url" class="form-control" value="{{ profile.github_url or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Website URL</label>
                    <input type="url" name="website_url" class="form-control" value="{{ profile.website_url or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">ORCID ID</label>
                    <input type="text" name="orcid_id" class="form-control" value="{{ profile.orcid_id or '' }}"
                           placeholder="0000-0000-0000-0000">
                </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{{ url_for('admin.user_detail', user_id=user.id) }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>Save Profile
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
