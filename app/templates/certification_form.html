{% extends "base.html" %}

{% block title %}Add Certification{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Add Certification</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label>Certification Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Issuing Organization</label>
                            <input type="text" name="issuer" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>Year</label>
                            <input type="text" name="year" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>Credential ID</label>
                            <input type="text" name="credential_id" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{{ url_for('cv.list_certifications') }}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
