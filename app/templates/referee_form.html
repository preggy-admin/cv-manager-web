{% extends "base.html" %}

{% block title %}{{ 'Edit' if referee else 'Add' }} Referee{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4><i class="fas fa-user-tie"></i> {{ 'Edit' if referee else 'Add' }} Referee</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label>Name</label>
                            <input type="text" name="name" class="form-control" 
                                   value="{{ referee.name if referee else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Title</label>
                            <input type="text" name="title" class="form-control" 
                                   value="{{ referee.title if referee else '' }}"
                                   placeholder="e.g., Professor of Computer Science">
                        </div>
                        <div class="mb-3">
                            <label>Company / Institution</label>
                            <input type="text" name="company" class="form-control" 
                                   value="{{ referee.company if referee else '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" name="email" class="form-control" 
                                   value="{{ referee.email if referee else '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Phone</label>
                            <input type="text" name="phone" class="form-control" 
                                   value="{{ referee.phone if referee else '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Relationship</label>
                            <input type="text" name="relationship" class="form-control" 
                                   value="{{ referee.relationship if referee else '' }}"
                                   placeholder="e.g., Former Manager">
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Save Referee
                        </button>
                        <a href="{{ url_for('cv.list_referees') }}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
