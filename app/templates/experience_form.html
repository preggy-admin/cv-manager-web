{% extends "base.html" %}

{% block title %}{{ 'Edit' if exp else 'Add' }} Experience{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>{{ 'Edit' if exp else 'Add' }} Work Experience</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label>Company</label>
                            <input type="text" name="company" class="form-control" value="{{ exp.company if exp else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Position</label>
                            <input type="text" name="position" class="form-control" value="{{ exp.position if exp else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Start Date</label>
                            <input type="text" name="start_date" class="form-control" placeholder="e.g., Jan 2020" value="{{ exp.start_date if exp else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label>End Date</label>
                            <input type="text" name="end_date" class="form-control" placeholder="e.g., Dec 2023 or leave blank if current" value="{{ exp.end_date if exp else '' }}">
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="current" class="form-check-input" {% if exp and exp.current %}checked{% endif %}>
                            <label class="form-check-label">I currently work here</label>
                        </div>
                        <div class="mb-3">
                            <label>Description</label>
                            <textarea name="description" class="form-control" rows="5" placeholder="Describe your responsibilities and achievements">{{ exp.description if exp else '' }}</textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{{ url_for('cv.list_experience') }}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
