{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>Edit Profile</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label>Full Name</label>
                            <input type="text" name="name" class="form-control" value="{{ profile.name or '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Professional Title</label>
                            <input type="text" name="title" class="form-control" value="{{ profile.title or '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ profile.phone or '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" name="email" class="form-control" value="{{ profile.email or '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Location</label>
                            <input type="text" name="location" class="form-control" value="{{ profile.location or '' }}">
                        </div>
                        <div class="mb-3">
                            <label>LinkedIn URL</label>
                            <input type="url" name="linkedin_url" class="form-control" value="{{ profile.linkedin_url or '' }}">
                        </div>
                        <div class="mb-3">
                            <label>GitHub URL</label>
                            <input type="url" name="github_url" class="form-control" value="{{ profile.github_url or '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Personal Website</label>
                            <input type="url" name="website_url" class="form-control" value="{{ profile.website_url or '' }}">
                        </div>
                        <div class="mb-3">
                            <label>ORCID ID</label>
                            <input type="text" name="orcid_id" class="form-control" value="{{ profile.orcid_id or '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Professional Summary</label>
                            <textarea name="summary" class="form-control" rows="5">{{ profile.summary or '' }}</textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="{{ url_for('cv.dashboard') }}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
