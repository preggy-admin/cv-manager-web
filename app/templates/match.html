{% extends "base.html" %}

{% block title %}Job Match{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>Match Your CV to a Job</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label>Job Description</label>
                            <textarea name="job_description" class="form-control" rows="10" placeholder="Paste the job description here..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Analyze Match</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
