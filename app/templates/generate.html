{% extends "base.html" %}

{% block title %}Generate CV{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Generate Your CV</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label>Select Template</label>
                            <select name="template" class="form-control">
                                <option value="classic">Classic Professional</option>
                                <option value="modern">Modern Clean</option>
                                <option value="compact">Compact Executive</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Output Format</label>
                            <select name="format" class="form-control">
                                <option value="html">HTML (Web View)</option>
                                <option value="pdf">PDF (Download)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Generate CV</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_head %}
<script>
// Track when generate button is clicked
document.addEventListener('DOMContentLoaded', function() {
    const generateForm = document.querySelector('form');
    if (generateForm) {
        generateForm.addEventListener('submit', function() {
            const template = document.querySelector('select[name="template"]').value;
            const format = document.querySelector('select[name="format"]').value;
            trackCVGeneration(template, format);
        });
    }
});
</script>
{% endblock %}
