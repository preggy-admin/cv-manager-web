{% extends "base.html" %}

{% block title %}{{ 'Edit' if edu else 'Add' }} Education{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>{{ 'Edit' if edu else 'Add' }} Education</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label>Institution</label>
                            <input type="text" name="institution" class="form-control" value="{{ edu.institution if edu else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Degree</label>
                            <input type="text" name="degree" class="form-control" value="{{ edu.degree if edu else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Field of Study</label>
                            <input type="text" name="field" class="form-control" value="{{ edu.field if edu else '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Start Year</label>
                            <input type="text" name="start_year" class="form-control" placeholder="e.g., 2015" value="{{ edu.start_year if edu else '' }}">
                        </div>
                        <div class="mb-3">
                            <label>End Year</label>
                            <input type="text" name="end_year" class="form-control" placeholder="e.g., 2019 or leave blank if current" value="{{ edu.end_year if edu else '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Description (optional)</label>
                            <textarea name="description" class="form-control" rows="3">{{ edu.description if edu else '' }}</textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{{ url_for('cv.list_education') }}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
